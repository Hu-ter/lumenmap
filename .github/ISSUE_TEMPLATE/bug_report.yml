name: Bug Report
description: File a bug report to help us fix errors, visual glitches, or unexpected behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the structured fields below to help us reproduce and fix the issue.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Provide a clear and concise description of the bug or unexpected behavior.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Describe the exact steps required to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Outcome
      description: What did you expect to happen instead?
      placeholder: Clear description of expected behavior...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence & Logs
      description: Screenshots, error traces, or console output demonstrating the issue.
      placeholder: Paste error logs, stack traces, or screenshots...
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Select your operating system or deployment environment.
      options:
        - "macOS"
        - "Linux"
        - "Windows"
        - "iOS / Mobile"
        - "Android / Mobile"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: scope_verification
    attributes:
      label: Scope & Verification Plan
      description: Describe the scope of the fix and how a maintainer or contributor should verify the resolution.
      placeholder: Steps or tests to verify the fix...
    validations:
      required: false
